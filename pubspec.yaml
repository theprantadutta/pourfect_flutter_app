name: pourfect_flutter_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.4.0+15

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # NOTE: cupertino_icons was removed — it cost 257 KB in the release APK and
  # nothing uses it. Every glyph in this game is drawn by a CustomPainter.

  firebase_core: ^4.14.0

  # Analytics. The per-level funnel is how we find the levels that cost us
  # retention, so it ships WITH the UI, not after it.
  firebase_analytics: ^12.0.0

  # State management: Riverpod, manual providers only. No code generation, no
  # build_runner, no mixing styles. See CLAUDE.md.
  flutter_riverpod: ^3.2.0

  # Local progress. Must work with zero network — the backend is optional
  # enrichment and may never block a level from opening.
  shared_preferences: ^2.3.0

  # Game audio. SoLoud is a low-latency mixer that can load a clip straight
  # from memory, which is what lets every cue be synthesised at startup
  # instead of shipped as an asset.
  flutter_soloud: ^5.1.1

  # Audio SESSION policy — separate concern from playback, and the one that
  # decides whether we stop somebody's podcast. See CLAUDE.md.
  audio_session: ^0.2.0

  # Version string in Settings, and the privacy-policy link Play requires to be
  # reachable from inside the app as well as from the store listing.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.0

  # Ads and the single Remove Ads purchase. Both sit behind interfaces in
  # services/, so the network or the store can change without touching game
  # code. See generated/ad_config.md.
  google_mobile_ads: ^9.1.0
  flutter_inapp_purchase: ^10.6.1
  http: ^1.6.0
  firebase_auth: ^6.6.1
  # Sign-in is an UPGRADE from anonymous, never a migration: Firebase keeps the
  # same uid through linkWithCredential, so the server row and every star under
  # it survive. Needs GOOGLE_WEB_CLIENT_ID as serverClientId or Android returns
  # an account with a null idToken.
  google_sign_in: ^7.1.1
  firebase_messaging: ^16.6.0
  in_app_review: ^2.0.12
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  in_app_update: ^5.0.0
  refresh_rate: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Pure-Dart engine tests run under `dart test` — no device, no Flutter
  # binding, and fast enough to run the 1,000-board solvability sweep.
  test: ^1.25.0

  # On-device frame timing. `adb shell dumpsys gfxinfo` reports zero frames for
  # a Flutter app — Impeller renders to its own surface and bypasses Android's
  # HWUI pipeline entirely — so a captured timeline is the only real number.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # The native splash, generated from assets/brand/:
  #   dart run flutter_native_splash:create
  # Launcher icons are NOT generated: the pre-sized mipmaps are dropped in by
  # hand so the documented adaptive-icon XML is not overwritten.
  flutter_native_splash: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Baked at build time by tool/generate_levels.dart and committed.
    # Regenerating must reproduce this byte-for-byte; see level_asset_test.dart.
    - assets/levels/levels.bin
    # Directory, so the OFL text for each bundled face can be dropped in
    # without a pubspec change. See assets/fonts/ATTRIBUTION.md.
    - assets/licenses/
    # Privacy policy, terms of use and refund policy, BUNDLED rather than
    # linked. A hosted page is still required for the store listing, but the
    # in-app copy cannot 404, cannot drift behind the installed version, and
    # is readable with no network — which matters for a game that is otherwise
    # fully playable offline.
    - assets/legal/
    # Only the two images the splash handoff paints at runtime. The rest of
    # assets/brand/ are build-time masters (flutter_native_splash, store art)
    # and would be dead bytes in the APK.
    - assets/brand/splash_logo_1200.png
    - assets/brand/android12_splash_icon_1152.png
    # Public identifiers and endpoint URLs: the backend base URLs and the
    # Google OAuth web client id. Gitignored, so a fresh clone must copy
    # .env.example to .env before it will build — the same setup step the
    # example file's own header describes. Everything in it ships inside the
    # APK and is readable from any downloaded build; nothing secret goes here.
    - .env

  fonts:
    # Bundled, not fetched. `google_fonts` exists for runtime fetching, which we
    # explicitly do not do — the game must be fully playable offline and a font
    # must never pop in on first launch. See assets/fonts/ATTRIBUTION.md.
    #
    # Display face: the logo, titles, big numbers and CTA labels. One weight.
    # Subset to Latin — the upstream file carries Hangul and weighs 1.5 MB.
    - family: BagelFatOne
      fonts:
        - asset: assets/fonts/BagelFatOne-Regular.ttf
    # UI face. Discrete static weights, not the variable font: Flutter's weight
    # matching is far more predictable with separate files.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_native_splash:
  color: "#FF5A36"
  image: assets/brand/splash_logo_1200.png
  android_12:
    color: "#FF5A36"
    image: assets/brand/android12_splash_icon_1152.png
    icon_background_color: "#FF5A36"
  fullscreen: true
  web: true
